<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonaid board</title>
<style>
  :root { --accent: #e0a800; --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent); padding-bottom: 12px; }
  h1 { margin: 0; font-size: 1.3rem; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; border: 1px dashed var(--line); border-radius: 8px; margin-top: 20px; }
</style>
</head>
<body>
  <header><h1>🍋 Lemonaid</h1></header>
  <div class="empty">No topics yet. Questions, ideas and problems will show up here.</div>
</body>
