project: "Lemonaid"
tagline: "A public discussion and issues board any website can add with one line"
updated: 2026-10-31
phases:
  - id: P1
    name: "First version"
    tasks:
      - id: T1
        title: "Skeleton: a demo website with an empty board added by one line"
        status: done
        effort: 1
        depends_on: []
        see: "Open it: a pretend product website shows an empty board that says Lemonaid, with the one line to copy underneath."
      - id: T2
        title: "The board and topic pages, with a welcome topic to read"
        status: done
        effort: 2
        depends_on: [T1]
        see: "Open it: the board lists a welcome topic. Click it to read it and its reply."
      - id: T3
        title: "Sign in with email and a 6-digit code (test mailbox)"
        status: done
        effort: 2
        depends_on: [T2]
        see: "Open it, press Sign in and type any email. Open the test mailbox link to see the code, type it in, and the board shows you're signed in."
      - id: T4
        title: "Start a topic and reply, with labels, links and code"
        status: done
        effort: 2
        depends_on: [T3]
        see: "Open it, sign in, press New topic, pick the label Bug, write a few lines with a link and some code, and post it. It shows on the board. Then reply to it."
      - id: T5
        title: "Paste screenshots into topics and replies"
        status: done
        effort: 2
        depends_on: [T4]
        see: "Copy a screenshot, open it, start a topic and paste it into the text box. The picture shows in the preview and in the posted topic."
      - id: T6
        title: "The built-in bad-word check stops rude posts"
        status: done
        effort: 1
        depends_on: [T4]
        see: "Open it and try to post a topic with a swear word in it. It isn't posted, and a friendly note says why."
      - id: T7
        title: "Upvotes, sorting by most wanted, and filters by label and status"
        status: done
        effort: 1
        depends_on: [T4]
        see: "Open it, upvote a topic, and switch the board to Most wanted: that topic moves to the top. Filter by Idea to see only ideas."
      - id: T8
