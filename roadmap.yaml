        status: done
        effort: 3
        depends_on: [T6, T7]
        see: "Open it and sign in with the owner email shown on the demo page. Topics now have buttons to set a status, delete and flag. The Owner's room lists posts the checks held back, plus people."
      - id: T9
        title: "Reply emails with an off switch, and real email sending"
        status: done
        effort: 2
        depends_on: [T4]
        see: "Open it, reply to someone else's topic, and open the test mailbox: the topic's author got a reply email with a link back and an unsubscribe link."
      - id: T10
        title: "The optional AI check the owner can switch on"
        status: pending
        effort: 2
        depends_on: [T8]
        see: "Open the Owner's room: the AI check shows as off until a key is added. With it on, a nasty post with no swear words gets held back for the owner."
      - id: T11
        title: "Owner's colour, phone-friendly layout, and the open-source setup guide"
        status: pending
        effort: 2
        depends_on: [T8, T9]
        see: "Open it: the demo page lets you try a colour and the board changes to match. Make the window narrow like a phone and it still reads well. The project has a clear setup guide and an MIT licence."
